[project]
name = "ha-skylink-orbit"
version = "0.2.1"
requires-python = ">=3.14.2"
dependencies = ["aiohttp==3.14.4", "aiomqtt==2.5.1"]

[dependency-groups]
dev = ["pytest-homeassistant-custom-component==0.13.371", "ruff==0.17.3", "mypy==2.4.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
files = ["custom_components/skylink_orbit"]
check_untyped_defs = true
ignore_missing_imports = true

